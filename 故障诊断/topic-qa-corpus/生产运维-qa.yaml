  question: 关于 Kubernetes Ingress 全栈进阶培训 (从入门到专家), 有什么最佳实践?
  answer: 'requests: cpu=200m, memory=256Mi; limits: cpu=1, memory=512Mi。实际资源消耗取决于 QPS、TLS 握手频率、规则数量。建议通过监控观察实际使用量后调整。TLS
    卸载是最消耗 CPU 的操作，如果 QPS > 5000，建议考虑硬件加速或使用外部 TLS 终结。在高并发场景下，Worker 进程数建议设置为 CPU 核心数。'
  source: 生产运维/topic-learn/topic-presentations/kubernetes-ingress-presentation.md
