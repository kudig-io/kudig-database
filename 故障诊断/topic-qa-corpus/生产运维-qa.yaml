  question: '关于 Day 17: 可观测性 - 监控 + Prometheus, 有什么最佳实践?'
  answer: 开发环境 7 天，预发环境 15 天，生产环境 30 天。如果需要更长的保留期，使用 Thanos 将数据上传到对象存储。Prometheus 本地存储（TSDB）不适合长期存储，每个 Prometheus 实例建议不超过
