<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--sidebar-w:280px;--panel-bg:rgba(12,16,28,0.96);--border:rgba(80,100,200,0.18);--accent:#6b7cf7;--text:#c0ccdd;--text-dim:#5a6a88;--text-bright:#e8edff;--scrollbar:rgba(80,100,200,0.25)}
body{background:#080c18;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif;overflow:hidden;color:var(--text);display:flex;height:100vh}

::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--scrollbar);border-radius:3px}

#left-panel{width:var(--sidebar-w);min-width:var(--sidebar-w);height:100vh;background:var(--panel-bg);border-right:1px solid var(--border);display:flex;flex-direction:column;z-index:10;overflow:hidden}
.panel-header{padding:14px 16px 10px;border-bottom:1px solid var(--border)}
.panel-header h1{font-size:15px;font-weight:700;color:var(--text-bright);letter-spacing:1px}
.panel-header .sub{font-size:10px;color:var(--text-dim);margin-top:3px}
#search-box{width:100%;padding:7px 10px;background:rgba(30,40,70,0.6);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:12px;outline:none;margin-top:8px}
#search-box:focus{border-color:var(--accent)}
#search-box::placeholder{color:var(--text-dim)}

#tree-container{flex:1;overflow-y:auto;padding:6px 0}
.tree-section{margin-bottom:2px}
.tree-section-header{display:flex;align-items:center;gap:6px;padding:6px 14px;cursor:pointer;font-size:12px;font-weight:600;transition:background .15s}
.tree-section-header:hover{background:rgba(80,100,200,0.08)}
.tree-section-header .arrow{font-size:9px;color:var(--text-dim);transition:transform .2s;width:12px;text-align:center}
.tree-section-header .arrow.open{transform:rotate(90deg)}
.tree-section-header .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.tree-section-header .count{font-size:10px;color:var(--text-dim);margin-left:auto}
.tree-children{display:none}
.tree-children.open{display:block}
.tree-item{display:flex;align-items:center;gap:5px;padding:3px 14px 3px 32px;cursor:pointer;font-size:11px;color:var(--text-dim);transition:all .15s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tree-item:hover{color:var(--text);background:rgba(80,100,200,0.06)}
.tree-item.active{color:var(--accent);background:rgba(107,124,247,0.1)}
.tree-leaf{display:flex;align-items:center;gap:5px;padding:2px 14px 2px 48px;font-size:10px;color:rgba(140,160,190,0.5);cursor:default;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tree-leaf:hover{color:rgba(140,160,190,0.8)}
.tree-leaf .dot-sm{width:4px;height:4px;border-radius:50%;flex-shrink:0;opacity:.4}

#center{flex:1;position:relative;overflow:hidden}
#center svg{display:block;width:100%;height:100%}
.node-label{fill:var(--text);font-size:10px;font-weight:500;pointer-events:none;text-anchor:middle;paint-order:stroke;stroke:#080c18;stroke-width:3px}
.node-label.l0{font-size:15px;font-weight:700;fill:#fff;stroke-width:4px}
.node-label.l1{font-size:12px;font-weight:600}
.link{fill:none;stroke-linecap:round}
.link-contains{stroke:rgba(80,100,200,0.1);stroke-width:1.2}
.link-depends{stroke:rgba(255,160,60,0.15);stroke-width:0.8;stroke-dasharray:4 3}
.link-relates{stroke:rgba(100,200,150,0.08);stroke-width:0.6;stroke-dasharray:2 4}
.dimmed{opacity:.06!important;transition:opacity .3s}
.highlighted{opacity:1!important;transition:opacity .3s}
.node-glow{opacity:0;transition:opacity .2s}
.node:hover .node-glow{opacity:.35}

#right-panel{width:0;overflow:hidden;background:var(--panel-bg);border-left:1px solid var(--border);z-index:10;transition:width .3s}
#right-panel.open{width:320px}
#detail-content{padding:18px;width:320px}
#detail-content .close-btn{float:right;cursor:pointer;font-size:16px;color:var(--text-dim);padding:2px 6px;border-radius:4px;transition:all .15s}
#detail-content .close-btn:hover{color:var(--text);background:rgba(80,100,200,0.1)}
.detail-tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:600;margin-bottom:10px}
.detail-title{font-size:17px;font-weight:700;color:var(--text-bright);margin-bottom:6px;line-height:1.3}
.detail-desc{font-size:12px;color:var(--text-dim);line-height:1.5;margin-bottom:14px}
.detail-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.stat-card{background:rgba(30,40,70,0.4);border:1px solid var(--border);border-radius:8px;padding:10px;text-align:center}
.stat-card .val{font-size:20px;font-weight:700;color:var(--accent)}
.stat-card .lbl{font-size:10px;color:var(--text-dim);margin-top:2px}
.detail-section-title{font-size:12px;font-weight:600;color:var(--text-dim);margin-bottom:6px;text-transform:uppercase;letter-spacing:1px}
.detail-links{margin-bottom:14px}
.detail-link{display:flex;align-items:center;gap:6px;padding:4px 8px;font-size:11px;color:var(--text-dim);cursor:pointer;border-radius:4px;transition:all .15s}
.detail-link:hover{background:rgba(80,100,200,0.08);color:var(--text)}
.detail-link .dot-xs{width:5px;height:5px;border-radius:50%;flex-shrink:0}

#zoom-controls{position:absolute;bottom:16px;right:16px;display:flex;flex-direction:column;gap:4px}
#zoom-controls button{width:32px;height:32px;background:var(--panel-bg);border:1px solid var(--border);border-radius:6px;color:var(--text-dim);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
#zoom-controls button:hover{color:var(--text);border-color:var(--accent)}

#breadcrumb{position:absolute;top:12px;left:12px;font-size:11px;color:var(--text-dim);z-index:5}
#breadcrumb span{cursor:pointer;transition:color .15s}
#breadcrumb span:hover{color:var(--accent)}
#breadcrumb .sep{margin:0 4px;color:rgba(80,100,200,0.3)}
</style>

var treeEl=document.getElementById('tree-container');

function buildTree(){
  var html='';
  for(var cat in hierarchy){
    var g=hierarchy[cat];
    var col=colorMap[cat];
    var totalDocs=g.children.reduce(function(s,c){return s+c.docs},0);
    html+='<div class="tree-section" data-cat="'+cat+'">';
    html+='<div class="tree-section-header" onclick="toggleSection(this)"><span class="arrow">&#9654;</span><span class="dot" style="background:'+col+'"></span><span>'+g.label+'</span><span class="count">'+totalDocs+'篇</span></div>';
    html+='<div class="tree-children">';
    g.children.forEach(function(c){
      html+='<div class="tree-item" data-id="'+c.id+'" onclick="selectNode(\''+c.id+'\')"><span class="dot" style="background:'+col+';width:5px;height:5px;border-radius:50%;flex-shrink:0;opacity:.7"></span><span>'+c.label+'</span><span class="count" style="margin-left:auto;font-size:10px;color:#5a6a88">'+c.docs+'</span></div>';
      if(c.leaves&&c.leaves.length){
        html+='<div class="tree-children" id="leaves-'+c.id+'">';
        c.leaves.forEach(function(lf){
          var txt=lf.length>30?lf.substring(0,30)+'…':lf;
          html+='<div class="tree-leaf" title="'+lf.replace(/"/g,'&quot;')+'"><span class="dot-sm" style="background:'+col+'"></span>'+txt+'</div>';
        });
        html+='</div>';
      }
    });
    html+='</div></div>';
  }
  treeEl.innerHTML=html;
}
buildTree();

window.toggleSection=function(el){
  var ch=el.nextElementSibling;
  var arrow=el.querySelector('.arrow');
  if(ch.style.display==='block'){ch.style.display='none';arrow.classList.remove('open')}
  else{ch.style.display='block';arrow.classList.add('open')}
};

window.selectNode=function(id){
  var n=nodeMap[id];
  if(!n)return;
  document.querySelectorAll('.tree-item').forEach(function(el){el.classList.remove('active')});
  var el=document.querySelector('.tree-item[data-id="'+id+'"]');
  if(el){el.classList.add('active');var parent=el.closest('.tree-children');if(parent&&parent.style.display!=='block'){parent.style.display='block';var arrow=parent.previousElementSibling.querySelector('.arrow');if(arrow)arrow.classList.add('open')}}
  showDetail(n);
  highlightNode(id);
};

function highlightNode(id){
  var connected=new Set([id]);
  links.forEach(function(l){
    var sid=typeof l.source==='object'?l.source.id:l.source;
    var tid=typeof l.target==='object'?l.target.id:l.target;
    if(sid===id)connected.add(tid);
    if(tid===id)connected.add(sid);
  });
  nodeSel.classed('dimmed',function(n){return!connected.has(n.id)}).classed('highlighted',function(n){return connected.has(n.id)});
  linkSel.classed('dimmed',function(l){var sid=typeof l.source==='object'?l.source.id:l.source;var tid=typeof l.target==='object'?l.target.id:l.target;return sid!==id&&tid!==id}).classed('highlighted',function(l){var sid=typeof l.source==='object'?l.source.id:l.source;var tid=typeof l.target==='object'?l.target.id:l.target;return sid===id||tid===id});
  labelSel.classed('dimmed',function(n){return!connected.has(n.id)});
}

function clearHighlight(){
  nodeSel.classed('dimmed',false).classed('highlighted',false);
  linkSel.classed('dimmed',false).classed('highlighted',false);
  labelSel.classed('dimmed',false);
}

  var catLabel=catLabels[n.category]||n.category;
  var html='<div class="detail-tag" style="background:'+col+'22;color:'+col+';border:1px solid '+col+'44">'+catLabel+'</div>';
  html+='<div class="detail-title">'+n.label+'</div>';
  if(n.desc)html+='<div class="detail-desc">'+n.desc+'</div>';
  html+='<div class="detail-stats"><div class="stat-card"><div class="val" style="color:'+col+'">'+n.docs+'</div><div class="lbl">文档数</div></div>';
  html+='<div class="stat-card"><div class="val" style="color:'+col+'">'+(n.leaves?n.leaves.length:'—')+'</div><div class="lbl">子主题</div></div></div>';

  var inLinks=[],outLinks=[];
  links.forEach(function(l){
    var sid=typeof l.source==='object'?l.source.id:l.source;
    var tid=typeof l.target==='object'?l.target.id:l.target;
    if(sid===n.id)outLinks.push({id:tid,type:l.type});
    if(tid===n.id)inLinks.push({id:sid,type:l.type});
  });
  if(outLinks.length){
    html+='<div class="detail-section-title">关联下游 ('+outLinks.length+')</div><div class="detail-links">';
    outLinks.forEach(function(lk){
      var tn=nodeMap[lk.id];if(!tn)return;
      html+='<div class="detail-link" onclick="selectNode(\''+lk.id+'\')"><span class="dot-xs" style="background:'+colorMap[tn.category]+'"></span>'+tn.label+'</div>';
    });
    html+='</div>';
  }
  if(inLinks.length){
    html+='<div class="detail-section-title">关联上游 ('+inLinks.length+')</div><div class="detail-links">';
    inLinks.forEach(function(lk){
      var tn=nodeMap[lk.id];if(!tn)return;
      html+='<div class="detail-link" onclick="selectNode(\''+lk.id+'\')"><span class="dot-xs" style="background:'+colorMap[tn.category]+'"></span>'+tn.label+'</div>';
    });
    html+='</div>';
  }

  if(n.leaves&&n.leaves.length){
    html+='<div class="detail-section-title">文档列表 ('+n.leaves.length+')</div><div class="detail-links" style="max-height:280px;overflow-y:auto">';
    n.leaves.forEach(function(lf){
      html+='<div class="detail-link" style="cursor:default"><span class="dot-xs" style="background:'+col+';opacity:.5"></span><span style="font-size:10px">'+lf+'</span></div>';
    });
    html+='</div>';
  }
  detailBody.innerHTML=html;

  setTimeout(function(){
    var newW=document.getElementById('center').clientWidth;
    var newH=document.getElementById('center').clientHeight;
    svg.attr('width',newW).attr('height',newH);
    sim.force('center',d3.forceCenter(newW/2,newH/2));
    sim.alpha(.2).restart();
  },350);
}

// Graph node hover/click
nodeSel.on('click',function(e,d){
  if(d.level===0)return;
  selectNode(d.id);
}).on('mouseover',function(e,d){
  if(d.level===0)return;
  d3.select(this).select('.ncore').transition().duration(150).attr('r',d.r+3).attr('stroke-width',2.5).attr('stroke-opacity',1);
}).on('mouseout',function(e,d){
  d3.select(this).select('.ncore').transition().duration(150).attr('r',d.r).attr('stroke-width',d.level===0?2.5:d.level===1?1.5:1).attr('stroke-opacity',.7);
  if(!rightPanel.classList.contains('open'))clearHighlight();
});

// Search
document.getElementById('search-box').addEventListener('input',function(){
  var q=this.value.toLowerCase().trim();
  document.querySelectorAll('.tree-section').forEach(function(sec){
    var items=sec.querySelectorAll('.tree-item');
    var anyVisible=false;
    items.forEach(function(item){
      var id=item.getAttribute('data-id');
      var n=nodeMap[id];
      var match=!q||(n&&(n.label.toLowerCase().indexOf(q)>=0||(n.desc&&n.desc.toLowerCase().indexOf(q)>=0)||id.indexOf(q)>=0));
      var leafMatch=!q;
      if(!leafMatch){
        var leafContainer=document.getElementById('leaves-'+id);
        if(leafContainer){
          leafContainer.querySelectorAll('.tree-leaf').forEach(function(leaf){
            if(leaf.getAttribute('title')&&leaf.getAttribute('title').toLowerCase().indexOf(q)>=0)leafMatch=true;
          });
        }
      }
      item.style.display=(match||leafMatch)?'flex':'none';
      if(match||leafMatch)anyVisible=true;
    });
    sec.style.display=anyVisible?'block':'none';
    if(q&&anyVisible){
      sec.querySelector('.tree-children').style.display='block';
      var arrow=sec.querySelector('.arrow');if(arrow)arrow.classList.add('open');
    }
  });
  if(q){
    var matchIds=new Set();
    nodes.forEach(function(n){if(n.label.toLowerCase().indexOf(q)>=0||(n.desc&&n.desc.toLowerCase().indexOf(q)>=0)||n.id.indexOf(q)>=0)matchIds.add(n.id)});
    var connected=new Set(matchIds);
    links.forEach(function(l){var sid=typeof l.source==='object'?l.source.id:l.source;var tid=typeof l.target==='object'?l.target.id:l.target;if(matchIds.has(sid))connected.add(tid);if(matchIds.has(tid))connected.add(sid)});
    nodeSel.classed('dimmed',function(n){return!connected.has(n.id)}).classed('highlighted',function(n){return matchIds.has(n.id)});
    linkSel.classed('dimmed',function(l){var sid=typeof l.source==='object'?l.source.id:l.source;var tid=typeof l.target==='object'?l.target.id:l.target;return!matchIds.has(sid)&&!matchIds.has(tid)});
    labelSel.classed('dimmed',function(n){return!connected.has(n.id)});
  }else{
    clearHighlight();
    document.querySelectorAll('.tree-section').forEach(function(sec){sec.style.display='block'});
    document.querySelectorAll('.tree-item').forEach(function(item){item.style.display='flex'});
  }
});

// Zoom controls
document.getElementById('zoom-in').onclick=function(){svg.transition().duration(300).call(zoom.scaleBy,1.4)};
document.getElementById('zoom-out').onclick=function(){svg.transition().duration(300).call(zoom.scaleBy,.7)};
document.getElementById('zoom-reset').onclick=function(){svg.transition().duration(500).call(zoom.transform,d3.zoomIdentity)};

window.addEventListener('resize',function(){
  var w=document.getElementById('center').clientWidth;
  var h=document.getElementById('center').clientHeight;
  svg.attr('width',w).attr('height',h);
  sim.force('center',d3.forceCenter(w/2,h/2));
  sim.alpha(.2).restart();
});
})();
</script>
</body>
</html>
