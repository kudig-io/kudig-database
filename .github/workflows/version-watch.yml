name: Version Watch

# 每周检查监控组件的最新 release；发现新版本即在库内检索受影响页面并自动开 issue，
# 提醒复核并补 frontmatter verified-upon「截至版本」字段。组件清单与状态：
# maintaining/02-元数据/version-watch.json

on:
  schedule:
    - cron: '0 2 * * 1' # UTC 周一 02:00 = 北京时间周一 10:00
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: version-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect new component releases
        id: detect
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess, urllib.request

          cfg = json.load(open("maintaining/02-元数据/version-watch.json", encoding="utf-8"))
          token = os.environ.get("GITHUB_TOKEN", "")
          state = cfg.get("state", {})
          sections = []

          def latest_release(repo, headers):
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/releases/latest", headers=headers)
              with urllib.request.urlopen(req, timeout=30) as resp:
                  return (json.load(resp) or {}).get("tag_name", "")

          def latest_tag(repo):
              proc = subprocess.run(
                  ["git", "ls-remote", "--tags", "--refs", f"https://github.com/{repo}.git"],
                  capture_output=True, text=True)
              if proc.returncode != 0:
                  raise RuntimeError((proc.stderr or "").strip()[:120])
              tags = [line.split("refs/tags/", 1)[1] for line in proc.stdout.splitlines()
                      if "refs/tags/" in line]
              stable = []
              for tag in tags:
                  match = re.search(r"(\d+)\.(\d+)\.(\d+)$", tag)
                  if match and not re.search(r"(alpha|beta|rc|pre|snapshot|dev|nightly)", tag, re.I):
                      stable.append((tuple(int(x) for x in match.groups()), tag))
              return max(stable)[1] if stable else ""

          for comp in cfg["components"]:
              repo, name = comp["repo"], comp["name"]
              headers = {"Accept": "application/vnd.github+json"}
              if token:
                  headers["Authorization"] = f"Bearer {token}"
              track = comp.get("track", "release")
              tag, error = "", ""
              try:
                  tag = latest_tag(repo) if track == "tag" else latest_release(repo, headers)
              except Exception as exc:
                  error = exc
              if not tag and track != "tag":
                  try:
                      tag = latest_tag(repo)
                  except Exception as exc:
                      error = error or exc
              if not tag:
                  print(f"::warning::{repo} 获取版本失败: {error}")
                  continue
              if state.get(repo) == tag:
                  continue

              affected = []
              for kw in comp["keywords"]:
                  out = subprocess.run(
                      ["git", "grep", "-l", "-i", kw, "--", "wiki", "skills"],
                      capture_output=True, text=True)
                  affected += out.stdout.splitlines()
              affected = sorted(set(affected))
              preview = "\n".join(f"- `{p}`" for p in affected[:15])
              more = f"\n- …等共 {len(affected)} 个页面" if len(affected) > 15 else ""
              sections.append(
                  f"## {name} 新版本 `{tag}`（上次记录：`{state.get(repo, '无')}`）\n\n"
                  f"库内受影响页面 {len(affected)} 个：\n{preview}{more}\n")
              state[repo] = tag

          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"new={'true' if sections else 'false'}\n")
          if sections:
              body = (
                  "以下监控组件发布了新版本。请在复核相关页面后，为修订过的实体/技能页"
                  "补充 frontmatter `verified-upon` 字段（如 `verified-upon: k8s-1.31`）。\n\n"
                  + "\n".join(sections))
              with open("/tmp/version-watch-body.md", "w", encoding="utf-8") as fh:
                  fh.write(body)
              cfg["state"] = state
              with open("maintaining/02-元数据/version-watch.json", "w", encoding="utf-8") as fh:
                  json.dump(cfg, fh, ensure_ascii=False, indent=2)
          PY

      - name: Create follow-up issue
        if: steps.detect.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "组件版本跟进 $(date -u +%F)" \
            --body-file /tmp/version-watch-body.md

      - name: Commit updated state
        if: steps.detect.outputs.new == 'true'
        run: |
          if ! git diff --quiet maintaining/02-元数据/version-watch.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add maintaining/02-元数据/version-watch.json
            git commit -m "chore(version-watch): 更新组件版本状态"
            git push
          fi
