name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install mdBook
        run: |
          MDBOOK_VERSION="0.4.44"
          curl -sSL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C /usr/local/bin

      - name: Create symlinks
        working-directory: gitbook
        run: |
          src_dir="src"
          content_root=".."
          for dir in ${content_root}/domain-* ${content_root}/topic-* ${content_root}/tables; do
            if [ -d "$dir" ]; then
              name=$(basename "$dir")
              link="${src_dir}/${name}"
              if [ -d "$link" ] && [ ! -L "$link" ]; then
                rm -rf "$link"
                ln -sf "../../${name}" "$link"
              elif [ ! -e "$link" ]; then
                ln -sf "../../${name}" "$link"
              fi
            fi
          done

      - name: Generate SUMMARY.md
        working-directory: gitbook
        run: bash build-scripts/generate-summary.sh

      - name: Build mdBook
        working-directory: gitbook
        run: mdbook build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: gitbook/book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
