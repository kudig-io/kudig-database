name: Secret Scan (gitleaks)

# 只扫描新增提交，不对存量历史翻旧账（2.1 万文件的历史内容不阻塞门禁）。
# 手动触发可选全量历史扫描（大仓库，耗时较长）。
# 覆盖范围说明：push 事件覆盖本仓库所有分支的直推；fork 来源的 PR 不触发 push 事件。

on:
  push:
  workflow_dispatch:
    inputs:
      full:
        description: '全量扫描整个历史（慢）'
        type: boolean
        default: false

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: ${{ github.event_name == 'workflow_dispatch' && inputs.full && 0 || 200 }}

      - name: Install gitleaks (pinned v8.18.4)
        run: |
          curl -sSfL https://raw.githubusercontent.com/gitleaks/gitleaks/v8.18.4/scripts/install.sh \
            | sh -s -- -b /usr/local/bin v8.18.4
          gitleaks version

      - name: Scan new commits (push)
        if: github.event_name == 'push'
        run: |
          set -eu
          BEFORE="${{ github.event.before }}"
          if [ "${#BEFORE}" -eq 40 ] && git cat-file -e "$BEFORE" 2>/dev/null; then
            RANGE="$BEFORE..HEAD"
          else
            # 新分支首推（before 为全零或对象不在浅克隆内）：只扫最新提交
            RANGE="-1 HEAD"
          fi
          echo "扫描范围: $RANGE"
          gitleaks detect --log-opts="$RANGE" --redact --verbose

      - name: Scan (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ inputs.full }}" = "true" ]; then
            echo "全量历史扫描"
            gitleaks detect --redact --verbose
          else
            echo "扫描最新提交"
            gitleaks detect --log-opts="-1 HEAD" --redact --verbose
          fi
