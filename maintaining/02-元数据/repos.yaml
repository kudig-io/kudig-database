# =============================================================================
# 上游源码检出清单（vendored source checkouts）
# =============================================================================
# code/repo/ 下的第三方源码树体积大、可重建，不进入本仓库（见 .gitignore），
# 只在此登记版本事实。新环境重建 / 升级命令：
#
#   make repo-sync            # 克隆清单中缺失的源码树
#   make repo-status          # 查看各源码树 ref / HEAD / 体积
#   make repo-update          # 已有源码树按清单 ref 更新
#   make repo-update-latest   # 解析上游最新稳定发布 → 写回清单 → 更新源码树
#
# 直连 github.com 不通时的两种代理方式（任选其一）：
#   1) 本地 HTTP 代理（如 Clash 7897）：export HTTPS_PROXY=http://127.0.0.1:7897
#   2) git 镜像前缀：python3 code/scripts/maintenance/repo-sync.py sync --proxy https://gh-proxy.com
#      （也可 export KUDIG_GIT_PROXY=https://gh-proxy.com）
#
# 字段：
#   name         目录名，检出位置为 <root>/<name>
#   url          上游仓库原始地址（代理由 --proxy 叠加，不写进清单）
#   ref          锁定的 tag / 分支 / commit
#   track        latest-release：按 GitHub Releases 最新稳定版解析 ref
#                latest-tag：仓库只打 tag、不发 Release 时，取最大稳定 semver tag
#                （留空表示锁定分支/SHA，不自动跟随上游）
#   depth        浅克隆深度，0 表示完整历史
#   updated      本清单该条目的最后核对日期
#   description  用途与对应知识域，便于判断是否还需要保留
# =============================================================================

