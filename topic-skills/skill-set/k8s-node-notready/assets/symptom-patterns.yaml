# K8s Node NotReady 症状模式
# Symptom patterns for Agent routing and matching
# 数据来源: topic-skills/01-node-notready.md Section 2

symptoms:
  # S1: kubectl get nodes 输出 NotReady
  - id: S1
    description:
      cn: "kubectl get nodes 输出中节点 STATUS 列显示 NotReady"
      en: "kubectl get nodes shows NotReady status"
    detection:
      command: "kubectl get nodes --no-headers | grep NotReady"
      pattern: "NotReady"
      method: "kubectl get nodes 并检查 STATUS 列"
    confidence: 0.95
    exclusions:
      - cn: "节点正在进行计划内维护（已标注 maintenance annotation）"
        en: "Node undergoing planned maintenance (annotated with maintenance annotation)"
      - cn: "新节点初始化尚未完成"
        en: "New node initialization not yet complete"

  # S2: 节点状态 flapping（Ready/NotReady 频繁切换）
  - id: S2
    description:
      cn: "节点状态在 Ready 和 NotReady 之间频繁切换（flapping）"
      en: "Node status flapping between Ready and NotReady"
    detection:
      command: "kubectl get events --field-selector involvedObject.kind=Node --sort-by=.lastTimestamp"
      pattern: "短时间内交替出现 NodeReady 和 NodeNotReady 事件"
      method: "查看短时间内交替出现 NodeReady 和 NodeNotReady 事件"
    confidence: 0.85
    exclusions:
      - cn: "节点正在进行滚动升级（kubelet 版本更新）期间短暂状态变更"
        en: "Brief status changes during rolling upgrade (kubelet version update)"

  # S3: Pod 被大量驱逐
  - id: S3
    description:
      cn: "节点上的 Pod 被大量驱逐"
      en: "Pods are being evicted from the node"
    detection:
      command: "kubectl get events --field-selector reason=Evicted"
      pattern: "大量 Evicted Pod"
      method: "kubectl get events --field-selector reason=Evicted 或 kubectl get pods --field-selector spec.nodeName=<node> --all-namespaces 显示大量 Evicted Pod"
    confidence: 0.80
    exclusions:
      - cn: "用户主动执行 kubectl drain"
        en: "User manually executed kubectl drain"
      - cn: "HPA 缩容导致的正常 Pod 终止"
        en: "Normal pod termination due to HPA scale-down"

  # S4: DiskPressure 为 True
  - id: S4
    description:
      cn: "节点 Condition 中 DiskPressure 为 True"
      en: "Node DiskPressure condition is True"
    detection:
      command: "kubectl describe node <node>"
      pattern: "DiskPressure=True"
      method: "kubectl describe node <node> 的 Conditions 表中 DiskPressure=True"
    confidence: 0.90
    exclusions:
      - cn: "临时性大文件写入已完成，磁盘压力即将自行恢复"
        en: "Temporary large file write completed, disk pressure about to self-recover"

  # S5: MemoryPressure 为 True
  - id: S5
    description:
      cn: "节点 Condition 中 MemoryPressure 为 True"
      en: "Node MemoryPressure condition is True"
    detection:
      command: "kubectl describe node <node>"
      pattern: "MemoryPressure=True"
      method: "kubectl describe node <node> 的 Conditions 表中 MemoryPressure=True"
    confidence: 0.90
    exclusions:
      - cn: "应用内存突增后已被 OOM Killer 回收，压力可能短暂出现后恢复"
        en: "Memory spike recovered by OOM Killer, pressure may briefly appear then recover"

  # S6: PIDPressure 为 True
  - id: S6
    description:
      cn: "节点 Condition 中 PIDPressure 为 True"
      en: "Node PIDPressure condition is True"
    detection:
      command: "kubectl describe node <node>"
      pattern: "PIDPressure=True"
      method: "kubectl describe node <node> 的 Conditions 表中 PIDPressure=True"
    confidence: 0.85
    exclusions:
      - cn: "批处理任务（Job/CronJob）短期内创建大量进程但即将完成"
        en: "Batch jobs (Job/CronJob) creating many processes but about to complete"

  # S7: kubelet 日志中 apiserver 连接拒绝
  - id: S7
    description:
      cn: "kubelet 日志中出现 apiserver 连接拒绝"
      en: "kubelet logs show connection refused to apiserver"
    detection:
      command: 'ssh <node-ip> "journalctl -u kubelet --since \"10 minutes ago\" | grep -i \"connection refused\\|dial tcp\\|TLS handshake\""'
      pattern: "connection refused|dial tcp|TLS handshake"
      method: "SSH 到节点后查看 kubelet 日志中的连接错误"
      requires_ssh: true
    confidence: 0.75
    exclusions:
      - cn: "apiserver 正在重启或升级中（计划内变更），短暂连接失败"
        en: "apiserver restarting or upgrading (planned change), brief connection failure"

  # S8: 容器运行时 socket 无响应
  - id: S8
    description:
      cn: "容器运行时 socket 无响应"
      en: "Container runtime socket not responding"
    detection:
      command: 'ssh <node-ip> "crictl --runtime-endpoint unix:///run/containerd/containerd.sock info"'
      pattern: "超时或报错"
      method: "SSH 到节点后检查 containerd socket 是否响应"
      requires_ssh: true
    confidence: 0.70
    exclusions:
      - cn: "containerd 正在执行 garbage collection，临时无响应（通常 <30s）"
        en: "containerd performing garbage collection, temporarily unresponsive (usually <30s)"

  # S9: Prometheus 告警 KubeNodeNotReady 已触发
  - id: S9
    description:
      cn: "Prometheus 告警 KubeNodeNotReady 已触发"
      en: "Prometheus KubeNodeNotReady alert fired"
    detection:
      command: "检查 Alertmanager 或 Prometheus"
      pattern: 'kube_node_status_condition{condition="Ready",status="false"} == 1'
      method: "检查 Alertmanager 或 Prometheus 中告警状态"
    confidence: 0.95
    exclusions:
      - cn: "告警系统延迟导致已恢复节点仍有未 resolve 的告警"
        en: "Alert system delay causing unresolved alerts for recovered nodes"

  # S10: Node Lease 对象长时间未更新
  - id: S10
    description:
      cn: "节点上报的 Lease 对象长时间未更新"
      en: "Node Lease object not renewed"
    detection:
      command: "kubectl get lease -n kube-node-lease <node-name> -o jsonpath='{.spec.renewTime}'"
      pattern: "renewTime 超过 node-monitor-grace-period（默认 40s）"
      method: "检查 Lease renewTime 是否超过默认 40s 的 node-monitor-grace-period"
    confidence: 0.90
    exclusions:
      - cn: "时钟偏差导致 renewTime 显示异常但节点实际运行正常"
        en: "Clock skew causing abnormal renewTime display but node actually running normally"

# 排除规则 / Exclusion rules
# 以下场景不适用本 Skill，Agent 应路由到其他 Skill 或手动处理
exclusion_rules:
  - condition:
      cn: "节点状态 Ready，但 Pod 处于 CrashLoopBackOff"
      en: "Node is Ready but Pod is in CrashLoopBackOff"
    route_to: SKILL-POD-001
    reason:
      cn: "Pod 自身问题，非节点级故障"
      en: "Pod-level issue, not a node-level fault"

  - condition:
      cn: "节点状态 Ready，但 Pod 长期 Pending"
      en: "Node is Ready but Pod is Pending for a long time"
    route_to: SKILL-POD-002
    reason:
      cn: "调度问题（资源不足、亲和性约束等），节点本身正常"
      en: "Scheduling issue (insufficient resources, affinity constraints, etc.), node itself is healthy"

  - condition:
      cn: "节点状态 Ready，但出现证书相关错误"
      en: "Node is Ready but certificate-related errors appear"
    route_to: SKILL-SEC-001
    reason:
      cn: "证书问题未影响到节点状态，属于安全类故障"
      en: "Certificate issue not affecting node status, classified as security fault"

  - condition:
      cn: "节点被标记为 SchedulingDisabled（已 cordon）但状态为 Ready"
      en: "Node is marked SchedulingDisabled (cordoned) but status is Ready"
    route_to: null
    reason:
      cn: "人工主动操作，非故障"
      en: "Manual deliberate operation, not a fault"

  - condition:
      cn: "新建集群中所有节点从未进入 Ready"
      en: "All nodes in a new cluster have never entered Ready state"
    route_to: null
    reason:
      cn: "超出本 Skill 范围，需排查 bootstrap 流程"
      en: "Outside this Skill scope, need to investigate bootstrap process"

  - condition:
      cn: "仅 kubelet 版本偏旧但节点运行正常"
      en: "Only kubelet version is outdated but node is running normally"
    route_to: null
    reason:
      cn: "版本差异不构成故障"
      en: "Version difference does not constitute a fault"

# 工单关键词映射 / Ticket keyword mapping
# Agent 应将包含以下描述的工单映射到本 Skill
ticket_keywords:
  cn:
    - "XX 节点状态异常，显示 NotReady，请排查"
    - "集群中有节点不可用，Pod 被驱逐"
    - "kubelet 挂了，节点状态变成 NotReady"
    - "节点内存/磁盘告警，状态不正常"
    - "节点不可达，无法调度 Pod"
    - "k8s 节点失联，请尽快处理"
    - "线上节点状态抖动，时好时坏"
  en:
    - "Node is not ready, pods are being evicted"
    - "Kubelet stopped posting status, node shows NotReady"
    - "Node unreachable, workloads impacted"
    - "Disk pressure on node causing evictions"
    - "Container runtime down on worker node"
    - "Node flapping between Ready and NotReady"
    - "Multiple nodes showing Unknown status"
