# K8s Node NotReady Skill Metadata
# K8s 节点 NotReady 技能元数据
# Machine-parseable by AI Agent runtime / 供 AI Agent 运行时机器解析
# 数据来源: topic-skills/01-node-notready.md

skill:
  id: SKILL-NODE-001
  name:
    cn: "节点 NotReady 诊断与修复"
    en: "Node NotReady Diagnosis & Remediation"
  version: "1.0.0"
  category: node
  severity_range: P0-P2
  k8s_versions: ["1.28", "1.29", "1.30", "1.31", "1.32"]
  estimated_resolution_time: "5-30min"
  risk_level: high
  # L1-advisory: Agent 提出建议并等待人工确认后执行
  agent_execution_mode: L1-advisory

  # 前置条件 / Prerequisites
  requires:
    tools: [kubectl, ssh, openssl]
    optional_tools: [jq, crictl, nc, curl]
    rbac: cluster-admin
    # 至少需要对 nodes、pods、events 的 get/list/watch 权限
    rbac_minimum: "nodes/pods/events: get, list, watch"
    access: [ssh_to_nodes]
    monitoring: "Prometheus + kube-state-metrics"

  # 本 Skill 提供的能力
  provides:
    - node_notready_diagnosis
    - node_notready_remediation
    - node_health_verification

# 路由规则 / Routing rules for Agent dispatcher
routing:
  # 触发关键词 / Trigger keywords
  trigger_keywords:
    cn:
      - "NotReady"
      - "节点不可用"
      - "节点异常"
      - "节点不可达"
    en:
      - "NotReady"
      - "NodeNotReady"
      - "kubelet stopped"
      - "node unreachable"
      - "NodeStatusUnknown"

  # 触发事件 / Kubernetes events that trigger this skill
  trigger_events:
    - NodeNotReady
    - NodeStatusUnknown
    - KubeletNotReady
    - NodeHasDiskPressure
    - NodeHasMemoryPressure
    - NodeHasPIDPressure
    - NodeHasInsufficientMemory

  # 触发指标 / Prometheus metrics that trigger this skill
  trigger_metrics:
    - 'kube_node_status_condition{condition="Ready",status="false"}'
    - 'kube_node_status_condition{condition="Ready",status="unknown"}'
    - 'kube_node_status_condition{condition="MemoryPressure",status="true"}'
    - 'kube_node_status_condition{condition="DiskPressure",status="true"}'
    - 'kube_node_status_condition{condition="PIDPressure",status="true"}'

# 关联引用 / References
references:
  related_skills:
    - SKILL-POD-001
    - SKILL-POD-002
    - SKILL-SEC-001
  fta:
    - file: "topic-fta/list/node-fta.md"
      description:
        cn: "Node 异常 FTA 故障树 — 覆盖节点不可用/不稳定的全部成因路径"
        en: "Node anomaly FTA fault tree — covers all root cause paths for node unavailability/instability"
      # RC → FTA step_ids 双向映射索引
      rc_to_fta_steps:
        RC-001: ["evt_kubelet_down", "evt_heartbeat_fail"]
        RC-002: ["evt_rt_down", "evt_cri_sock", "evt_rt_hang"]
        RC-003: ["evt_disk_pressure", "evt_image_gc_fail"]
        RC-004: ["evt_mem_pressure", "evt_and_mem_low", "evt_and_mem_nolimit"]
        RC-005: ["evt_pid_exhaust"]
        RC-006: ["evt_api_unreachable", "evt_policy_block", "evt_route_fail"]
        RC-007: ["evt_kubelet_cert", "evt_node_cert_expire"]
        RC-008: ["evt_pleg", "evt_and_pleg_timeout", "evt_and_pleg_overload"]
        RC-009: ["evt_kernel_panic", "evt_driver_issue"]
        RC-010: ["evt_time_skew_tls"]
        RC-011: ["evt_cni_fail"]
        RC-012: ["evt_cordon"]
      # FTA 诊断入口步骤（Agent 从此处开始遍历 FTA 流程）
      fta_entry_step: "gate_root_or"
      # Agent 确认根因后，通过 skill_ref 跳转回 Skill 的修复操作
      skill_ref_field: "metadata.skill_ref"
  knowledge:
    - topic-structural-trouble-shooting/
    - domain-12-troubleshooting/
    - domain-1-architecture-fundamentals/

# 脚本清单 / Script inventory
scripts:
  diagnose_quick:
    path: scripts/diagnose-quick.sh
    description:
      cn: "Phase 1 快速检查 — kubectl 远程收集节点状态信息"
      en: "Phase 1 quick check — remote node status collection via kubectl"
    args: [NODE_NAME]
    risk: none
    phase: 1
  diagnose_deep:
    path: scripts/diagnose-deep.sh
    description:
      cn: "Phase 2 深度检查 — SSH 登录节点检查系统级组件"
      en: "Phase 2 deep check — SSH into node to inspect system-level components"
    args: [NODE_IP]
    risk: none
    phase: 2
  check_resources:
    path: scripts/check-resources.sh
    description:
      cn: "检查节点系统资源（磁盘、内存、PID、inode）"
      en: "Check node system resources (disk, memory, PID, inode)"
    args: [NODE_IP]
    risk: none
    phase: 2
  cleanup_disk:
    path: scripts/cleanup-disk.sh
    description:
      cn: "清理磁盘空间（容器镜像和日志）"
      en: "Clean up disk space (container images and logs)"
    args: [NODE_IP]
    risk: low
    remediation: REM-002
  verify_node:
    path: scripts/verify-node.sh
    description:
      cn: "修复后验证节点状态"
      en: "Verify node status after remediation"
    args: [NODE_NAME]
    risk: none
    phase: verification

# 根因和修复操作索引 / Root cause and remediation indices
root_causes:
  - RC-001  # kubelet 进程崩溃或未运行
  - RC-002  # 容器运行时（containerd）异常
  - RC-003  # 节点磁盘空间耗尽（DiskPressure）
  - RC-004  # 节点内存耗尽（MemoryPressure）
  - RC-005  # 节点 PID 耗尽（PIDPressure）
  - RC-006  # 节点与 apiserver 网络不通
  - RC-007  # kubelet 客户端证书过期
  - RC-008  # PLEG 不健康导致 NotReady
  - RC-009  # 内核故障/硬件异常
  - RC-010  # NTP 时间不同步
  - RC-011  # CNI 插件异常
  - RC-012  # 节点被手动 cordon/drain

remediations:
  - REM-001  # 取消节点 cordon 标记（低风险）
  - REM-002  # 清理磁盘空间（低风险）
  - REM-003  # 重启 kubelet 服务（中风险）
  - REM-004  # 重启 containerd 服务（中风险）
  - REM-005  # 调整 kubelet 驱逐阈值（中风险）
  - REM-006  # 排空节点并重启（高风险）
  - REM-007  # 替换节点（高风险，云环境）
  - REM-008  # 手动证书轮转（高风险）
  - REM-009  # 内核热补丁或 OS 升级（严重）
  - REM-010  # 硬件更换（严重）

# 典型触发场景 / Typical trigger scenarios
trigger_scenarios:
  - id: TS-001
    name:
      cn: "kubelet 异常"
      en: "kubelet abnormal"
    description:
      cn: "kubelet 进程崩溃、OOM、配置错误或无法启动，导致节点无法向 apiserver 上报心跳"
      en: "kubelet process crash, OOM, misconfiguration, or unable to start, causing node to stop sending heartbeat to apiserver"
  - id: TS-002
    name:
      cn: "容器运行时故障"
      en: "Container runtime failure"
    description:
      cn: "containerd / CRI-O 守护进程异常、socket 断开，kubelet 无法执行容器操作，PLEG 不健康"
      en: "containerd / CRI-O daemon failure, socket disconnected, kubelet cannot perform container operations, PLEG unhealthy"
  - id: TS-003
    name:
      cn: "网络分区"
      en: "Network partition"
    description:
      cn: "节点与 apiserver 之间网络不通，apiserver 收不到心跳，标记节点为 Unknown → NotReady"
      en: "Network unreachable between node and apiserver, no heartbeat received, node marked Unknown then NotReady"
  - id: TS-004
    name:
      cn: "资源压力"
      en: "Resource pressure"
    description:
      cn: "磁盘空间耗尽（DiskPressure）、内存耗尽（MemoryPressure）、PID 耗尽（PIDPressure）"
      en: "Disk exhaustion (DiskPressure), memory exhaustion (MemoryPressure), PID exhaustion (PIDPressure)"
  - id: TS-005
    name:
      cn: "证书过期"
      en: "Certificate expired"
    description:
      cn: "kubelet 客户端证书或 serving 证书过期，无法与 apiserver 建立 TLS 连接"
      en: "kubelet client or serving certificate expired, cannot establish TLS connection to apiserver"

# 重要提醒 / Important notes
notes:
  - cn: "本 Skill 覆盖工作节点和控制平面节点的 NotReady 场景"
    en: "This Skill covers both worker and control-plane node NotReady scenarios"
  - cn: "控制平面节点 NotReady 属于 P0 事件，需立即升级"
    en: "Control-plane node NotReady is a P0 event requiring immediate escalation"
