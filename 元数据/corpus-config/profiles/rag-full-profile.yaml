# 全量语料配置 — 信噪比优化版 v2
# 用途：完整知识库导出，供 AgentScope Agent NAS 挂载
# 变更：+synthesis/ 跨域合成页；+domain-17/topic-dictionary/ 术语语料
# 最后更新：2026-07-02

name: full-corpus
description: "KUDIG-DATABASE 全量语料导入配置（信噪比优化版）"

include:
  # Tier 1: 核心技术域（高信噪比，完整保留）
  - path: "集群基础/"
    chunking: by_h2
    priority: high
  - path: "工作负载/"
    chunking: by_h2
    priority: high
  - path: "网络/"
    chunking: by_h2
    priority: high
  - path: "存储/"
    chunking: by_h2
    priority: high
  - path: "安全/"
    chunking: by_h2
    priority: high
  - path: "可观测性/"
    chunking: by_h2
    priority: high

  # Tier 2: 平台与工程域（高信噪比）
  - path: "平台工程/"
    chunking: by_h2
    priority: high
  - path: "发布变更/"
    chunking: by_h2
    priority: high
  - path: "可靠性/"
    chunking: by_h2
    priority: high

  # Tier 3: 运维与诊断（核心资产，但排除 archive）
  - path: "故障诊断/"
    chunking: by_h2
    priority: high

  # Tier 4: 生产运维（整域保留；培训/讲师/演示/发布策略由下方 exclude 精确剔除，
  #        从而保留 ticket-cases、reply-templates、on-call/escalation playbook 等高价值运维内容）
  - path: "生产运维/"
    chunking: by_h2
    priority: high

  # Tier 5: 云厂商、运行时、AI Infra（按需保留）
  - path: "云厂商/"
    chunking: by_h2
    priority: medium
  - path: "容器运行时/"
    chunking: by_h2
    priority: medium
  - path: "AI基础设施/"
    chunking: by_h2
    priority: medium
  - path: "专项技术/"
    chunking: by_h2
    priority: medium
  - path: "数据库中间件/"
    chunking: by_h2
    priority: medium

  # Tier 6: 基础与参考域（严格筛选）
  - path: "系统基础/"
    chunking: by_h2
    priority: medium
    note: "Linux 基础 + topic-dictionary 术语语料（565 文件）"
  - path: "清单模式/"
    chunking: by_h2
    priority: medium
  - path: "生态参考/01-cncf-landscape/"
    chunking: by_h3
    priority: low
    note: "仅保留 Graduated/Incubating，Sandbox 知识密度过低"
  - path: "生态参考/02-papers/"
    chunking: by_h2
    priority: medium
  - path: "生态参考/topic-index/"
    chunking: by_h2
    priority: medium
    note: "知识图谱聚合页（25 个，均有实质内容），被正文大量引用"
  - path: "应用模式/"
    chunking: by_h2
    priority: low

  # 非 Domain 层：概念、技能、实体保留；报告、原始素材排除
  - path: "概念/"
    chunking: by_h2
    priority: high
  - path: "技能/"
    chunking: by_h2
    priority: high
  - path: "实体/"
    chunking: by_h2
    priority: medium
  - path: "综合/"
    chunking: by_h2
    priority: high
    note: "跨域合成页（共现分析产出），Agent 高价值连接页"
  # references/ 已合并至 实体/

exclude:
  # 构建产物与缓存
  - "*.pdf"
  - "*.png"
  - "*.xlsx"
  - ".git/"
  - ".ruff_cache/"
  - ".venv/"
  - "gitbook/book/"
  - "gitbook/dist/"
  - "gitbook/build-scripts/"

  # 元数据与报告（非知识内容）
  - "报告/"
  - "元数据/"
  - "_staging/"
  - "_raw/"
  - "CHANGELOG.md"
  - "ENHANCEMENT-RECORD.md"
  - "QUALITY_REPORT*"
  - "GAP-ANALYSIS.md"
  - "*.base"                    # Obsidian Bases 定义
  - ".obsidian/"                # Obsidian 配置

  # Archive 目录（与正式内容重复）
  - "**/*-archive/"
  - "**/archive/"

  # 低信噪比：培训、讲师、演示、发布策略
  - "生产运维/topic-best-practices/"
  - "生产运维/topic-k8s-lecturer/"
  - "生产运维/topic-learn/"
  - "生产运维/topic-presentations/"
  - "生产运维/topic-publish/"
  - "生产运维/journal/"
  - "生产运维/projects/"

  # 低信噪比：版本更新日志（时效性强，知识密度低）
  - "生态参考/topic-release-notes/"
  # 注：topic-index/ 保留（25 个知识图谱聚合页，均为实质内容，且被正文大量 [[引用]]，
  #     排除会造成 ~1550 处断链）

  # 低信噪比：CNCF Sandbox 项目（1600+ 文件中大部分为一句话简介）
  - "生态参考/01-cncf-landscape/sandbox/"

  # domain-17 topic-dictionary/ 已纳入导出（565 个术语文件，361 个与 实体/ 无重叠，
  # 平均 199 行/文件，总计 ~450K tokens 结构化术语语料）

  # 原始素材与草稿
  - ".zread/"
  - ".wiki-meta/"
  - "归档/"
  - "元数据/corpus-config/profiles/*.yaml"   # 自身不导入
