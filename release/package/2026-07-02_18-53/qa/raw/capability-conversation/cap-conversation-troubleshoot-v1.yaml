  # ========================================================================
  # 多轮对话：上下文保持与推理引导
  # ========================================================================
  - id: "cap-conversation-troubleshoot-v1-0002"
    question: >
      【完整对话历史】

      第1轮 - 用户: "payments 命名空间的 api-gateway Pod 反复重启"
      第1轮 - Agent: [已提供诊断命令]

      第2轮 - 用户: "kubectl get pods 显示 CrashLoopBackOff，
      kubectl logs 显示 'connection refused to redis-cluster:6379'"
      第2轮 - Agent: [已分析 Redis 连接失败，建议检查 redis-cluster Service 和 Endpoints]

      第3轮 - 用户: "redis-cluster 的 endpoints 是空的，
      但 Pod 都在 Running。Service selector 是 app=redis。"
      第3轮 - Agent: [已指出 selector 可能不匹配，建议检查 Pod labels]

      第4轮 - 用户: "Pod 的 label 是 app=redis-cluster，不是 app=redis。
      这是昨天部署时改的名称。"

      【第5轮 - 当前测评】
      Agent 需要基于前 4 轮完整上下文给出最终回复，要求：
      1. 确认根因：Service selector 与 Pod label 不匹配
      2. 给出修复方案（kubectl patch 或 edit）
      3. 提供验证命令
      4. 给出预防措施（如 label 命名规范或 CI 检查）
      5. 确认是否还有其他关联问题需要排查
    expected_answer: >
      Agent 预期回复示例：

      ```
      ✅ 根因已确认：Service `redis-cluster` 的 selector `app=redis` 与 Pod 实际 label
      `app=redis-cluster` 不匹配，导致 EndpointSlice 无法选中 Pod，Endpoints 为空。
      这解释了 api-gateway 的 `connection refused` 错误。

      **修复方案（二选一）**：

      方案 A：修改 Service selector 匹配现有 Pod label（推荐，改动最小）
      ```bash
      kubectl patch service redis-cluster -n payments -p '{"spec":{"selector":{"app":"redis-cluster"}}}'
      ```

      方案 B：修改 Pod label 匹配 Service selector
      ```bash
      kubectl label pods -l app=redis-cluster -n payments app=redis --overwrite
      # 同时需要更新 Deployment 模板中的 labels，否则重启后标签会恢复
      kubectl patch deployment redis-cluster -n payments -p '{"spec":{"template":{"metadata":{"labels":{"app":"redis"}}}}}'
      ```

      **验证**：
      ```bash
      kubectl get endpoints redis-cluster -n payments
      kubectl get endpointslices -n payments -l kubernetes.io/service-name=redis-cluster
      ```

      **预防措施**：
      1. 建立 label 命名规范：Service selector 必须与 Deployment template labels 一致。
      2. 在 CI/CD 中增加校验：部署前检查 Service selector 是否匹配目标工作负载的 labels。
      3. 使用 Helm/Kustomize 管理 labels，避免手动修改导致的不一致。

      修复后请观察 api-gateway 的 restart 次数是否停止增长：
      `kubectl get pods -l app=api-gateway -n payments -w`

      还有其他问题需要我协助排查吗？
      ```

      **上下文保持验证点**：
      - 引用了所有历史关键信息：payments namespace、api-gateway CrashLoopBackOff、
        redis-cluster endpoints 为空、label 是 app=redis-cluster。
      - 将因果链完整呈现：label 不匹配 → Endpoints 为空 → api-gateway 连不上 Redis → CrashLoopBackOff。
      - 提供了改动最小的修复方案（patch Service）和彻底的修复方案（patch Deployment）。
    type: multi_turn
    difficulty: L3_advanced
    cognitive_level: apply
    agent_config:
      max_turns: 5
      response_format: text
    evaluation:
      rubric_id: "R4-CONVERSATION-QUALITY"
      scoring_method: llm_as_judge
      max_score: 10
      passing_threshold: 7
      check_items:
