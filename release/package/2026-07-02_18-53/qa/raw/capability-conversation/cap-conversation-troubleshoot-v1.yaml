  # ========================================================================
  # 多轮对话：信息不足时主动澄清
  # ========================================================================
  - id: "cap-conversation-troubleshoot-v1-0001"
    question: >
      【第1轮 - 用户输入】
      "我们的服务挂了，快帮我看看！"

      【测评要求】
      Agent 的回复需要：
      1. 安抚用户情绪，确认正在处理
      2. 识别信息缺口（缺少集群、命名空间、Pod 名称、症状描述）
      3. 提出不超过 3 个最关键的澄清问题
      4. 给出用户可立即执行的 1 条快速自检命令
    variants:
      - "服务挂了，赶紧处理！"
      - "production is down, need help ASAP"
    expected_answer: >
      Agent 预期回复示例：

      ```
      我理解您的紧急情况，正在为您排查。为了快速定位问题，我需要确认几个关键信息：

      1. **故障范围**：是特定服务/Deployment 异常，还是整个集群/节点层面出现问题？
      2. **症状表现**：Pod 状态是什么（如 CrashLoopBackOff、Pending、ImagePullBackOff）？
         是否有具体的错误日志片段？
      3. **位置信息**：涉及哪个集群和命名空间（namespace）？

      您可以先执行以下命令快速查看异常 Pod 概览，把结果贴给我：
      ```bash
      kubectl get pods --all-namespaces --field-selector=status.phase!=Running,status.phase!=Succeeded
      ```
      ```

      **对话策略验证点**：
      - 没有直接猜测根因（信息不足）。
      - 问题按优先级排列：范围 → 症状 → 位置。
      - 提供了立即可执行的命令，让用户有参与感并加速信息收集。
    type: clarification
    difficulty: L2_intermediate
    cognitive_level: understand
    agent_config:
      max_turns: 5
      response_format: text
    evaluation:
