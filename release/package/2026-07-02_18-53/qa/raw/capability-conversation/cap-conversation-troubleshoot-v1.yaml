  # ========================================================================
  # 升级判断：何时需要人工介入
  # ========================================================================
  - id: "cap-conversation-troubleshoot-v1-0003"
    question: >
      【场景】
      Agent 在处理一个工单时，通过多轮对话收集到以下信息：
      - 集群：production
      - 症状：3 个 master 节点中的 2 个同时变为 NotReady
      - etcd 日志显示大量 "took too long" 和 "leader election" 消息
      - 用户尝试重启了一个 master 节点，但问题未恢复
      - 用户询问 "我能不能直接重启剩下那个 master？"

      【测评要求】
      Agent 需要判断：
      1. 当前情况是否超出 Agent 自主处理范围？
      2. 是否应建议用户升级（escalation）到人工 SRE？
      3. 如果建议升级，应给出什么理由和当前已收集的关键信息摘要？
      4. 如果建议用户不要重启最后一个 master，理由是什么？
    expected_answer: >
      Agent 预期回复示例：

      ```
      ⚠️ **强烈建议立即升级（Escalate）到值班 SRE 团队**。

      **升级理由**：
      1. **控制平面多数节点故障**：2/3 master 节点 NotReady，etcd 仅剩 1 个节点可运行。
         若此时再重启最后一个 master，etcd 将完全失去 quorum，集群进入不可恢复状态。
      2. **用户已执行高风险操作且未恢复**：已重启一个 master 但无效，说明问题可能
         超出单节点层面（如网络分区、底层存储故障、证书过期等）。
      3. **Agent 能力边界**：此类控制平面多数故障涉及 etcd 数据一致性、
         证书链验证、底层基础设施排查，需要人工判断和可能的 etcd 备份恢复操作，
         不建议通过自动化脚本批量操作。

      **请不要重启最后一个 master**。理由：
      - 3 节点 etcd 集群需要 2 个节点存活才能维持 quorum（majority = 2）。
      - 当前仅剩 1 个 master 可能还在运行 etcd，重启后将导致 **完全丢失 quorum**，
        所有 API 请求失败，已运行的 Pod 虽可继续工作，但无法完成任何调度、扩缩容或故障恢复。
      - 从仅剩的 etcd 节点导出快照备份是当前最高优先级，重启会破坏最后的机会。

      **已收集信息摘要（请转发给 SRE）**：
      - 集群：production
      - 故障：2/3 master NotReady，etcd leader election 频繁
      - 已执行操作：重启 1 个 master，无效
      - 风险：剩余 1 个 master 是最后的 quorum 保障
      - 建议优先操作：从存活 etcd 节点导出 `etcdctl snapshot save`

      值班 SRE 联系方式：[On-call PagerDuty/Slack]。
      ```

      **升级判断验证点**：
      - 正确识别多数 master 故障属于 P0 级事件。
      - 明确建议 escalation 而非继续自助排查。
      - 清晰解释 etcd quorum 机制和重启风险。
      - 提供结构化的信息摘要，加速人工接手。
    type: escalation
    difficulty: L4_expert
    cognitive_level: evaluate
    agent_config:
      max_turns: 3
      response_format: text
    evaluation:
      rubric_id: "R4-CONVERSATION-QUALITY"
      scoring_method: llm_as_judge
      max_score: 10
      passing_threshold: 8
      check_items:
        - "明确建议升级到人工 SRE"
        - "解释 etcd quorum 机制（3 节点需要 2 票）"
        - "警告不要重启最后一个 master"
        - "提供已收集信息的结构化摘要"
        - "给出最高优先级的应急建议（etcd snapshot）"
        - "语气紧迫但冷静，不引发恐慌"
    metadata:
      k8s_versions: ["1.28", "1.29", "1.30", "1.31", "1.32"]
      ticket_category: "TC-INFRA-CP"
      severity: "P0"
