  # ========================================================================
  # 标准流程类
  # ========================================================================
  - id: "cap-knowledge-architecture-v1-0003"
    question: >
      当一个新 Pod 被创建时，从 kubectl apply 到 Pod 实际运行在节点上，
      控制平面组件的完整协作流程是什么？请按时间顺序列出关键步骤。
    expected_answer: >
      完整流程如下（按时间顺序）：

      1. kubectl apply 发送 Pod YAML 到 kube-apiserver。
      2. API Server 执行认证（Authentication）和授权（Authorization），
         然后将资源定义写入 etcd（此时 Pod 处于 Pending 状态）。
      3. API Server 通过 Watch 机制通知 kube-scheduler 有新 Pod 待调度。
      4. Scheduler 执行调度算法（过滤 + 打分）：
         - 过滤阶段：排除不满足资源需求、亲和性/反亲和性、污点的节点。
         - 打分阶段：对剩余节点按优先级函数排序，选择最优节点。
      5. Scheduler 将 Pod 的 spec.nodeName 更新为选定节点，通过 API Server 写回 etcd。
      6. API Server 通知对应节点的 kubelet（通过 Watch 机制）。
      7. Kubelet 调用容器运行时（containerd/CRI-O）创建 Pod Sandbox 和网络命名空间。
      8. CNI 插件为 Pod 分配 IP 地址并配置网络。
      9. Kubelet 创建 Init Containers（如有）并按顺序执行。
      10. Kubelet 创建业务容器，通过镜像拉取策略（IfNotPresent/Always）获取镜像。
      11. Kubelet 执行健康检查（StartupProbe → LivenessProbe → ReadinessProbe）。
      12. ReadinessProbe 通过后，kubelet 更新 Pod 状态为 Running，
          EndpointSlice Controller 将 Pod IP 加入 Service Endpoints，流量开始接入。
    type: procedure
    difficulty: L3_advanced
    cognitive_level: understand
