  - id: "cap-knowledge-architecture-v1-0004"
    question: >
      Kubernetes v1.30 中，API Server 的 `--audit-log-maxage`、
      `--audit-log-maxbackup` 和 `--audit-log-maxsize` 三个参数的默认值
      和单位分别是什么？
    expected_answer: >
      - `--audit-log-maxage`: 默认值为 0（表示不删除旧日志），单位为天（days）。
        当值 > 0 时，超过该天数的审计日志文件会被自动删除。
      - `--audit-log-maxbackup`: 默认值为 0（在部分发行版或早期版本中为无限制，
        生产环境建议显式设置为如 10 或 20），单位为文件个数（保留的旧日志文件数量）。
        注意：0 表示不限制备份数量（以官方文档为准，不同环境可能有差异）。
      - `--audit-log-maxsize`: 默认值为 0（表示无限制），单位为 MB（兆字节）。
        当值 > 0 时，单个审计日志文件达到该大小后会自动轮转。

      生产环境建议配置：
      - maxage: 30
      - maxbackup: 10-20
      - maxsize: 100-500
    type: fact_retrieval
    difficulty: L1_beginner
