  # ========================================================================
  # 概念理解类（边界场景）
  # ========================================================================
  - id: "cap-knowledge-architecture-v1-0005"
    question: >
      什么是 Kubernetes 中的 "Resource Quota" 与 "Limit Range"？
      二者在资源管控中的职责边界有何不同？
    variants:
      - "ResourceQuota 和 LimitRange 有什么区别？"
      - "Differences between ResourceQuota and LimitRange in Kubernetes."
    expected_answer: >
      Resource Quota 和 Limit Range 都是 Kubernetes 命名空间级别的资源管控机制，
      但职责边界完全不同：

      **Resource Quota（资源配额）**
      - 作用域：Namespace 级别。
      - 核心职责：限制一个命名空间内可消耗的资源总量和对象数量上限。
      - 管控对象：
        - 计算资源总量：CPU 请求/限制总和、内存请求/限制总和。
        - 存储资源总量：PersistentVolumeClaims 总容量、特定 StorageClass 的容量。
        - 对象数量上限：Pod、Service、ConfigMap、Secret、PersistentVolumeClaim 等的最大数量。
      - 触发时机：创建或更新资源时，如果命名空间已使用资源 + 新请求 > Quota，则拒绝创建。
      - 使用场景：多租户环境中限制团队/项目的资源预算，防止某个命名空间耗尽集群资源。

      **Limit Range（限制范围）**
      - 作用域：Namespace 级别（但作用于单个 Pod/Container）。
      - 核心职责：为命名空间内的容器或 Pod 设置默认资源请求/限制，以及允许的最小/最大值。
      - 管控对象：
        - 默认值：若用户未设置 requests/limits，自动注入默认值。
        - 最小值/最大值：限制单个容器可声明的资源范围（如 CPU 必须在 100m-2 之间）。
        - 存储限制：限制 PVC 请求的最小/最大容量。
        - 比例限制：限制 request 与 limit 的比例（如 limit 不得超过 request 的 3 倍）。
      - 触发时机：Pod 创建时，校验并修改容器的 resources 字段。
      - 使用场景：规范团队资源声明习惯，防止忘记设置 limits 导致资源耗尽。

      **关键区别总结**：
      | 维度 | Resource Quota | Limit Range |
      |------|---------------|-------------|
      | 管控粒度 | 命名空间总量 | 单个 Pod/Container |
      | 核心功能 | 上限封顶 | 默认值 + 范围约束 |
      | 拒绝条件 | 总量超标 | 单个容器超出范围 |
      | 无默认值时 | 不干预 | 自动注入默认值 |
    type: comparison
    difficulty: L2_intermediate
