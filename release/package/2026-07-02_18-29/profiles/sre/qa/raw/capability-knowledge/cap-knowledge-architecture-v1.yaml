  - id: "cap-knowledge-architecture-v1-0001"
    question: >
      Kubernetes 中 etcd 的核心职责是什么？为什么集群通常建议部署
      3 个或 5 个 etcd 节点而不是 2 个或 4 个？
    variants:
      - "etcd 在 K8s 里做什么？为什么节点数要是奇数？"
      - "Explain etcd's role in Kubernetes and why odd-numbered clusters are preferred."
    expected_answer: >
      etcd 是 Kubernetes 的分布式键值存储，承担以下核心职责：
      (1) 存储集群所有配置数据、状态数据和元数据，是集群唯一的可信状态源（SSOT）；
      (2) 通过 Raft 共识算法实现分布式一致性，确保控制平面组件读取到的状态一致；
      (3) 提供 Watch 机制，允许 API Server 等组件实时监听资源变更事件。

      建议部署 3 或 5 个节点而非 2 或 4 个的原因基于 Raft 算法特性：
      - Raft 要求获得超过半数（majority）节点的投票才能提交写操作（选举 leader 或日志复制）。
      - 2 节点集群的容错能力为 0：任一节点故障后剩余 1 节点无法构成 majority（需要 2/2+1=2 票），
        集群变为只读或不可用。从成本角度，2 节点的容错能力与 1 节点相同。
      - 4 节点集群的容错能力为 1：虽然可容忍 1 节点故障，但与 3 节点集群的容错能力相同，
        却多出一台机器的成本。且 4 节点需要 3 票才能构成 majority，写入延迟更高。
      - 3 节点可容忍 1 故障，5 节点可容忍 2 故障，性价比最优。
