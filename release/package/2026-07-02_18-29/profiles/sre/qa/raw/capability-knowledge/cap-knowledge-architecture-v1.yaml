  - id: "cap-knowledge-architecture-v1-0002"
    question: >
      kube-proxy 的 iptables、IPVS 和 nftables 三种后端模式在
      大规模集群（>5000 节点）下的性能与适用场景有何差异？
    variants:
      - "kube-proxy iptables vs IPVS vs nftables，大规模集群选哪个？"
      - "Compare kube-proxy backends: iptables, IPVS, nftables for large clusters."
    expected_answer: >
      三种模式的差异对比：

      1. iptables 模式（默认，历史最久）
         - 原理：为每个 Service Endpoints 创建 iptables 规则，通过概率匹配实现负载均衡。
         - 性能瓶颈：规则数为 O(Services × Endpoints)，在 5000+ 节点、数万个 Service 的场景下，
           iptables 规则链呈线性增长，内核 netfilter 遍历耗时显著增加，Service 更新延迟可达秒级。
         - 适用：中小规模集群（<1000 Service，<10000 Endpoints）。

      2. IPVS 模式
         - 原理：基于内核中的 IP Virtual Server（L4 负载均衡器），使用哈希表管理转发规则，
           复杂度为 O(1)。
         - 性能优势：连接建立和转发性能远高于 iptables，支持多种负载均衡算法（rr/lc/dh/sh/sed/nq）。
           在 5000+ 节点集群中，Service 更新延迟为毫秒级。
         - 限制：需要内核加载 ip_vs 模块；不支持某些复杂的网络策略（如基于客户端 IP 的会话保持
           需要额外配置）。
         - 适用：大规模生产集群，尤其是高并发、高频 Service 变更场景。

      3. nftables 模式（Kubernetes v1.31+ 实验性）
         - 原理：使用 nftables（iptables 的下一代替代品）作为后端，规则组织更高效，
           使用 set/lookup 结构替代线性规则链。
         - 性能优势：规则更新为原子操作，无需遍历整个规则链；内存占用更低；
           与 iptables 模式相比，大规模场景下延迟降低 50%+。
         - 限制：较新，生态成熟度不如 IPVS；部分旧版内核不支持。
         - 适用：希望使用现代内核特性且愿意接受新技术的集群。

      大规模集群（>5000 节点）推荐：优先 IPVS（成熟稳定），或评估 nftables（未来方向）。
      iptables 在此规模下已成为已知瓶颈。
    type: comparison
