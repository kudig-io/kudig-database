[project]
name = "kudig-database-tools"
version = "0.1.0"
description = "Utility scripts for the KUDIG-DATABASE knowledge base"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    "numpy>=1.26",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = []
