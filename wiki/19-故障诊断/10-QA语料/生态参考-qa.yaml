  question: CentOS 7/8 停更后如何迁移到 Rocky Linux?
  answer: EL8 系可用社区工具 migrate2rocky 原地转换；跨大版本（7→8/9）无官方原地升级路径，按「运维操作」与「故障排查」章节走全新安装 + 配置/应用清单迁移。
  source: wiki/21-生态参考/04-开源项目/rocky-linux.md
- type: comparison
  question: Rocky Linux 和 AlmaLinux 应该怎么选?
  answer: 两者同为 RHEL 下游重建、功能无差异；按治理偏好（RESF vs AlmaLinux 基金会）、原地升级工具（AlmaLinux 有 ELevate）与 ISV 认证覆盖做选择，详见「对比」章节。
  source: wiki/21-生态参考/04-开源项目/rocky-linux.md
