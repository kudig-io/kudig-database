  # ========================================================================
  # E2E Case 1: Pod 网络连通性故障
  # ========================================================================
  - id: "benchmark-diagnostic-e2e-v1-0001"
    question: >
      【工单描述】
      "我们 payments 服务的 api-gateway Pod 突然无法连接到 redis 了，
      应用日志显示 connection refused。昨天还好好的，今天部署了新版本后出现。
      请帮忙排查。"

      【Agent 可用工具】
      kubectl, nslookup, nc, tcpdump, iptables, etcdctl

      【测评场景】
      这是一个完整的端到端工单，Agent 需要自主决定：
      1. 识别工单类别和意图
      2. 决定需要收集哪些信息（可模拟执行 kubectl 命令）
      3. 基于收集的信息进行根因分析
      4. 给出修复方案
      5. 提供预防建议
      6. 以专业、可信赖的方式与用户沟通

      【隐藏上下文（评测时注入）】
      当 Agent 执行 `kubectl get pod -n payments -l app=api-gateway` 时，
      返回：Pod Running，但 restartCount=3。
      当 Agent 执行 `kubectl logs -n payments api-gateway-xxx --previous` 时，
      返回：`Connection refused to redis-service:6379`。
      当 Agent 执行 `kubectl get endpoints redis-service -n payments` 时，
      返回：ENDPOINTS 为空。
      当 Agent 执行 `kubectl get pod -n payments -l app=redis` 时，
      返回：3 个 Redis Pod Running，labels 为 `app=redis-cluster`。
      当 Agent 执行 `kubectl get service redis-service -n payments -o yaml` 时，
      返回：selector 为 `app: redis`。
    expected_answer: >
      **完整端到端处理预期**：

      1. **意图识别**（10 分）
         - 工单类别：TC-APP-SVC（应用层服务连通性）
         - 子类别：Service 无 Endpoints 导致连接失败
         - 严重程度：P1（影响业务功能，但非集群级故障）
         - 关键词：connection refused、redis、payments、部署新版本后

      2. **信息收集**（15 分）
         Agent 应自主执行以下诊断命令（按优先级）：
         - `kubectl get pods -n payments -l app=api-gateway` → 确认 Pod 状态
         - `kubectl logs ... --previous` → 确认错误详情
         - `kubectl get service redis-service -n payments` → 检查 Service
         - `kubectl get endpoints redis-service -n payments` → 发现 Endpoints 为空
         - `kubectl get pods -n payments -l app=redis` → 发现 Pod labels 为 `app=redis-cluster`
         - 对比 Service selector `app: redis` 与 Pod label `app: redis-cluster` → 确认不匹配

      3. **根因分析**（20 分）
         - 根因：Service `redis-service` 的 selector 与 Redis Pod 的 labels 不匹配。
         - 触发条件：昨天部署了新版本，可能修改了 Deployment 的 labels 但未同步更新 Service selector。
         - 因果链：label 不匹配 → EndpointSlice 无法选中 Pod → Endpoints 为空 →
           DNS 解析到 Service IP 但无后端 → connection refused。

      4. **解决方案**（25 分）
         - 推荐方案：修改 Service selector 匹配现有 Pod labels（改动最小）
           ```bash
           kubectl patch service redis-service -n payments -p '{"spec":{"selector":{"app":"redis-cluster"}}}'
           ```
         - 备选方案：修改 Deployment template labels 和 Service selector 保持一致
         - 验证：
           ```bash
           kubectl get endpoints redis-service -n payments
           ```

      5. **预防建议**（15 分）
         - 在 CI/CD 中增加 label 一致性校验。
         - 使用 Helm/Kustomize 统一管理 labels，避免手动修改。
         - 部署后增加冒烟测试：验证关键 Service 的 Endpoints 非空。

      6. **沟通质量**（15 分）
         - 语气专业、清晰、鼓励用户验证。
         - 先给出快速修复（1 条命令），再解释根因。
         - 提供验证步骤让用户确认修复效果。
         - 总结时给出预防建议，体现闭环思维。
    type: multi_turn
    difficulty: L3_advanced
    cognitive_level: evaluate
    agent_config:
      max_turns: 8
      required_tools: [kubectl]
      response_format: text
    evaluation:
      rubric_id: "R6-E2E-COMPLETION"
      scoring_method: llm_as_judge
      max_score: 100
      passing_threshold: 75
