  question: 关于 Azure AKS 生产环境运行手册, 有什么最佳实践?
  answer: 工作负载统一使用 Azure AD Workload Identity，禁止在 Secret 中存放 Service Principal 密码。对于遗留应用，应制定明确的迁移计划，逐步淘汰 Service Principal
    并将密钥替换为 Managed Identity 联邦。迁移过程中应审计所有 `imagePullSecrets` 与自定义 Secret，确保无硬编码凭据。
  source: wiki/18-云厂商/04-Azure-AKS/06-azure-aks-production-runbook.md
