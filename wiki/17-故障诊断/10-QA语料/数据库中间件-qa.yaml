- type: best_practice
  question: 关于 MongoDB Kubernetes 生产指南, 有什么最佳实践?
  answer: 数据量 < 1TB 且 QPS 可控时优先使用 ReplicaSet；超过单节点写入瓶颈或数据增长预期 > 2TB/年时采用 Sharded Cluster。分片键选择是 Sharded Cluster 设计的核心，应满足高基数、低频率、非单调三个条件。错误选择的分片键会导致数据倾斜、热点
    Chunk 与均衡困难，最终影响集群性能与可用性。
  source: wiki/06-存储与数据/09-数据库/18-mongodb-kubernetes-production-guide.md
