- type: best_practice
  question: 关于 VictoriaMetrics 集群版 on Kubernetes, 有什么最佳实践?
  answer: 保留 Prometheus agent 模式作为采集端，将 remote write 目标指向 VictoriaMetrics，实现无侵入迁移。对于已有 Prometheus server，可逐步将 remote write
    地址切换到 vminsert，避免一次性改造带来的风险。
  source: wiki/06-存储与数据/12-时序数据库/03-victoriametrics-on-kubernetes.md
