- type: best_practice
  question: 关于 15-ban-ben-xie-shang-yu-jian-rong-xing-xiao-yan-ji-zhi, 有什么最佳实践?
  answer: '**插件开发者**：始终使用 `version.PluginSupports(...)` 显式声明插件支持的版本列表，而非使用 `version.All`。这确保了当新版本规范引入不兼容变更时，插件不会被错误地匹配到不支持的新版本。在
    `skel.PluginMainFuncs` 中传入准确的 `versionInfo` 参数是完成这一声明的标准方式。'
