# I-O Pair (Input-Output) Schema for SRE Agent Diagnosis Corpus
# 命令输出 → 诊断结论 语料规范
# Version: 1.0

schema_version: "1.0"
description: |
  每条 I-O 对记录一个命令的典型输出模式及其对应的诊断结论。
  Agent 通过匹配 output_pattern 来定位诊断结论和后续操作。

required_fields:
  - io_pair_id
  - skill_ref
  - scenario
  - command
  - output_pattern
  - diagnosis
  - severity

optional_fields:
  - fta_ref
  - root_cause_candidates
  - next_commands
  - confidence
  - tags
  - k8s_versions
  - notes

field_definitions:
  io_pair_id:
    type: string
    format: "IODIAG-{domain}-{sequence:04d}"
    example: "IODIAG-NODE-0001"
    description: 全局唯一标识符

  skill_ref:
    type: string
    description: 关联的 Skill ID 或文件名
    example: "SKILL-01" 或 "01-node-notready.md"

  fta_ref:
    type: string
    description: 关联的 FTA 文件名
    example: "node-fta.md"

  scenario:
    type: string
    description: 故障场景名称
    example: "节点 NotReady - kubelet 异常"

  severity:
    type: string
    enum: [critical, high, medium, low]
    description: 严重程度

  command:
    type: string
    description: 执行的命令（可含占位符如 <pod-name>）
    example: "kubectl get nodes"

  output_pattern:
    type: string
    description: |
      典型输出模式。支持以下标记：
      - ...          省略任意内容
      - <variable>   变量占位符
      - # comment    注释（匹配时忽略）
    example: |
      NAME       STATUS     ROLES   AGE   VERSION
      node-01    NotReady   worker  5d    v1.32.0

  diagnosis:
    type: array
    items: string
    description: 诊断结论列表，按确定性排序
    example:
      - "节点不健康，kubelet 可能挂掉或网络不通"
      - "超过 pod-eviction-timeout (5min) 后 Pod 会被驱逐"

  root_cause_candidates:
    type: array
    items: string
    description: 可能的根因列表
    example:
      - "kubelet 异常"
      - "容器运行时故障"

  action:
    type: array
    items: string
    description: 建议的后续操作命令
    example:
      - "kubectl describe node <node-name>"
      - "ssh <node-name> 'systemctl status kubelet'"

  confidence:
    type: number
    minimum: 0.0
    maximum: 1.0
    description: 模式匹配的置信度
    example: 0.95

  tags:
    type: array
    items: string
    description: 标签，用于分类和检索
    example: [node, status, notready, kubelet]

  k8s_versions:
    type: array
    items: string
    description: 适用的 K8s 版本范围
    example: ["1.28", "1.29", "1.30", "1.31", "1.32"]

  notes:
    type: string
    description: 补充说明
    example: "此模式在 v1.28+ 中可靠，旧版本输出格式可能略有不同"
